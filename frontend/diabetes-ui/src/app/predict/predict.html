<div class="container">
  <header class="header">
    <div class="logo-container">
      <img src="https://cdn-icons-png.flaticon.com/512/2864/2864333.png" alt="Logo" class="logo-icon">
      <h1 class="brand-name">AI Diabetes Analyzer</h1>
    </div>
  </header>

  <div class="card">
    <div class="card-header">
      <h2>AI-Powered Diabetes Risk Prediction</h2>
      <p class="subtitle">Enter patient health details and our AI model will analyze the risk of diabetes instantly.</p>
    </div>

    <h2>Diabetes Prediction</h2>

    <form (ngSubmit)="submitForm()">
      <div>
        <label>Pregnancies</label>
        <input type="number" [(ngModel)]="formData.pregnancies" name="pregnancies" required>
      </div>

      <div>
        <label>Glucose Level</label>
        <input type="number" [(ngModel)]="formData.glucose" name="glucose" required>
      </div>

      <div>
        <label>Blood Pressure</label>
        <input type="number" [(ngModel)]="formData.blood_pressure" name="bloodPressure" required>
      </div>

      <div>
        <label>Skin Thickness</label>
        <input type="number" [(ngModel)]="formData.skin_thickness" name="skinThickness" required>
      </div>

      <div>
        <label>Insulin</label>
        <input type="number" [(ngModel)]="formData.insulin" name="insulin" required>
      </div>

      <div>
        <label>BMI</label>
        <input type="number" step="0.1" [(ngModel)]="formData.bmi" name="bmi" required>
      </div>

      <div>
        <label>Diabetes Pedigree Function</label>
        <input type="number" step="0.01" [(ngModel)]="formData.dpf" name="dpf" required>
      </div>

      <div>
        <label>Age</label>
        <input type="number" [(ngModel)]="formData.age" name="age" required>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Analyzing with AI...' : 'Predict' }}
      </button>
    </form>

    <div *ngIf="errorMessage" class="result-box result-danger" style="margin-top: 15px;">
      {{ errorMessage }}
    </div>

    <div *ngIf="result"
      class="result-box"
      [ngClass]="result.prediction === 'Diabetic' ? 'result-danger' : 'result-success'">
      Result: {{result.prediction}}
    </div>

    <div *ngIf="recommendation" class="recommendation-box">
      <h3>AI Health Recommendation</h3>
      <p style="white-space: pre-line;">
        {{ recommendation }}
      </p>
    </div>
  </div>
</div>
